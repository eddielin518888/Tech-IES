<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Spacing and Sizing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>CSS Spacing and Sizing</h1>
    <hr />
    <h2>Sizing + 10px margin</h2>
    <section class="sizerow row">
      <div class="boxs box">100px</div>
      <div class="boxm box">150px</div>
      <div class="boxl box">200px</div>
      <div class="boxvar box">10vw</div>
    </section>
    <h2>Flex Row: space-around</h2>
    <section class="row1 row">
      <div class="box1 box"></div>
      <div class="box2 box"></div>
      <div class="box3 box"></div>
      <div class="box4 box"></div>
    </section>
    <h2>Flex Row: center</h2>
    <section class="row2 row">
      <div class="box5 box"></div>
      <div class="box6 box"></div>
      <div class="box7 box"></div>
      <div class="box8 box"></div>
    </section>
  </body>
</html>
